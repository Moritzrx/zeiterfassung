# Baut die Installer auf den Rechnern von GitHub: Windows-Installer (.exe) und Mac-Abbild (.dmg).
# Start von Hand: Reiter "Actions" → "Installer bauen" → "Run workflow".
# Oder automatisch, wenn eine Versionsmarke wie v1.0.0 hochgeladen wird; dann entsteht zusätzlich eine
# Veröffentlichung ("Release") mit beiden Dateien.
name: Installer bauen

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --ignore-scripts

      - name: Electron-Programmdatei laden
        run: node node_modules/electron/install.js

      - name: Installer bauen
        run: npm run build:win
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Installer ablegen
        uses: actions/upload-artifact@v4
        with:
          name: wessamedia-Zeit-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: An die Veröffentlichung anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe

  mac:
    name: Mac (.dmg für Intel und Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --ignore-scripts

      - name: Electron-Programmdatei laden
        run: node node_modules/electron/install.js

      - name: Fenster-Hilfsprogramm ausführbar machen
        run: chmod +x node_modules/get-windows/main

      - name: App bauen (Intel und Apple Silicon in einer Datei)
        run: npm run build:mac:app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Ohne Apple-Entwicklerkonto gibt es keine richtige Signatur. Eine Ad-hoc-Signatur reicht,
      # damit macOS auf Apple Silicon die App überhaupt startet.
      - name: Ad-hoc signieren
        run: codesign --force --deep --sign - "dist/mac-universal/wessamedia Zeit.app"

      - name: Signatur prüfen
        run: codesign --verify --deep --strict --verbose=2 "dist/mac-universal/wessamedia Zeit.app"

      - name: DMG packen
        run: npx electron-builder --mac dmg --universal --prepackaged "dist/mac-universal/wessamedia Zeit.app"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Abbild ablegen
        uses: actions/upload-artifact@v4
        with:
          name: wessamedia-Zeit-Mac
          path: dist/*.dmg
          if-no-files-found: error

      - name: An die Veröffentlichung anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
